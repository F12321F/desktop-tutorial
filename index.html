<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命理綜合占卜</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #e0e0e0;
            --accent-gold: #f1c40f;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .container {
            width: 95%;
            max-width: 800px;
            margin: 2rem auto;
            text-align: center;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1, h2 { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.4); }
        select, button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px 15px;
            margin: 8px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        select option { background: #1b2735; color: #fff; }
        button:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .hidden { display: none !important; }
        
        /* 卡牌區塊 */
        .cards-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .card-wrapper { display: flex; flex-direction: column; align-items: center; width: 140px; }
        .card-label { margin-bottom: 10px; font-weight: bold; color: var(--accent-gold); font-size: 14px; text-align: center; height: 40px;}
        .card { width: 120px; height: 200px; perspective: 1000px; cursor: pointer; }
        .card-inner { width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; position: relative; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card.flipped.reversed .card-inner { transform: rotateY(180deg) rotateZ(180deg); }
        .card-front, .card-back {
            width: 100%; height: 100%; position: absolute; backface-visibility: hidden;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--glass-border);
        }
        .card-back {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0, rgba(255,255,255,0.1) 2px, transparent 2px, transparent 10px);
        }
        .card-front {
            background: #fff; color: #000; transform: rotateY(180deg);
            flex-direction: column; text-align: center; padding: 10px; box-sizing: border-box;
        }
        .card-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .card-status { font-size: 12px; color: #e74c3c; margin-bottom: 10px; }
        
        /* 四大分析區塊 */
        .result-container { margin-top: 30px; text-align: left; }
        .analysis-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-gold);
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 0 10px 10px 0;
            line-height: 1.6;
        }
        .analysis-box.tarot { border-left-color: #9b59b6; background: rgba(155, 89, 182, 0.1); }
        .analysis-box.zodiac { border-left-color: #e67e22; background: rgba(230, 126, 34, 0.1); }
        .analysis-box.cz { border-left-color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .analysis-box.combined { border-left-color: #3498db; background: rgba(52, 152, 219, 0.1); }
        
        .analysis-box h3 { margin-top: 0; color: #fff; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
        .highlight { color: var(--accent-gold); font-weight: bold; }
        ul { padding-left: 20px; margin-top: 10px; }
        li { margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container" id="menu-screen">
    <div class="glass-panel">
        <h1>✨ 命理綜合占卜 ✨</h1>
        <p>結合塔羅、星座與生肖，為你提供全方位的指引</p>
        
        <div>
            <select id="zodiac-select">
                <option value="牡羊座">♈ 牡羊座</option>
                <option value="金牛座">♉ 金牛座</option>
                <option value="雙子座">♊ 雙子座</option>
                <option value="巨蟹座">♋ 巨蟹座</option>
                <option value="獅子座">♌ 獅子座</option>
                <option value="處女座">♍ 處女座</option>
                <option value="天秤座">♎ 天秤座</option>
                <option value="天蠍座">♏ 天蠍座</option>
                <option value="射手座">♐ 射手座</option>
                <option value="摩羯座">♑ 摩羯座</option>
                <option value="水瓶座">♒ 水瓶座</option>
                <option value="雙魚座">♓ 雙魚座</option>
            </select>
            <select id="chinese-zodiac-select">
                <option value="鼠">🐀 鼠</option>
                <option value="牛">🐂 牛</option>
                <option value="虎">🐅 虎</option>
                <option value="兔">🐇 兔</option>
                <option value="龍">🐉 龍</option>
                <option value="蛇">🐍 蛇</option>
                <option value="馬">🐎 馬</option>
                <option value="羊">🐏 羊</option>
                <option value="猴">🐒 猴</option>
                <option value="雞">🐓 雞</option>
                <option value="狗">🐕 狗</option>
                <option value="豬">🐖 豬</option>
            </select>
        </div>

        <div class="grid-buttons">
            <button onclick="startReading('daily')">🌟 每日運勢</button>
            <button onclick="startReading('work')">💼 工作運勢</button>
            <button onclick="startReading('wealth')">💰 財富運勢</button>
            <button onclick="startReading('love')">❤️ 感情運勢</button>
            <button onclick="startReading('health')" style="border-color: #2ecc71;">🌿 健康運勢</button>
            <button onclick="startReading('palmistry')" style="border-color: #9b59b6;">✋ 手相運勢</button>
        </div>
    </div>
</div>

<div class="container hidden" id="reading-screen">
    <div class="glass-panel">
        <h2 id="reading-title">占卜中...</h2>
        <p>請依序點擊下方卡牌，翻開你的命運</p>
        <div class="cards-container" id="cards-container"></div>
        
        <div id="result-text" class="result-container hidden">
            <div class="analysis-box tarot" id="box-tarot"></div>
            <div class="analysis-box zodiac" id="box-zodiac"></div>
            <div class="analysis-box cz" id="box-cz"></div>
            <div class="analysis-box combined" id="box-combined"></div>
            <button onclick="resetApp()" style="margin-top:20px; width:100%;">返回首頁重新占卜</button>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
    }

    const majorArcana = [
        { name: "愚者", up: "新的開始、冒險、天真", rev: "魯莽、不穩定" },
        { name: "魔術師", up: "創造力、主動、技能", rev: "潛能未發揮、欺騙" },
        { name: "女祭司", up: "直覺、神秘、潛意識", rev: "忽視直覺、表面" },
        { name: "皇后", up: "豐收、母性、培育", rev: "依賴、缺乏成長" },
        { name: "皇帝", up: "權威、結構、控制", rev: "獨裁、固執" },
        { name: "教皇", up: "傳統、信仰、教育", rev: "叛逆、打破傳統" },
        { name: "戀人", up: "結合、美好的選擇", rev: "失和、錯誤決定" },
        { name: "戰車", up: "勝利、意志力、推進", rev: "失控、挫折" },
        { name: "力量", up: "勇氣、耐心、內在力量", rev: "自我懷疑、軟弱" },
        { name: "隱者", up: "反省、內在指引", rev: "孤立、拒絕幫助" },
        { name: "命運之輪", up: "轉機、好運、順勢", rev: "霉運、抗拒改變" },
        { name: "正義", up: "公平、平衡、理性", rev: "不公、偏見" },
        { name: "倒吊人", up: "換位思考、犧牲、暫停", rev: "無謂犧牲、停滯" },
        { name: "死神", up: "結束、轉變、新生", rev: "抗拒改變、無法放下" },
        { name: "節制", up: "平衡、和諧、淨化", rev: "極端、失衡" },
        { name: "惡魔", up: "慾望、物質、束縛", rev: "解脫、重獲自由" },
        { name: "高塔", up: "突變、災難、信念崩塌", rev: "危機解除、拖延改變" },
        { name: "星星", up: "希望、靈感、平靜", rev: "絕望、悲觀" },
        { name: "月亮", up: "不安、恐懼、潛意識", rev: "真相大白、撥雲見日" },
        { name: "太陽", up: "成功、喜悅、活力", rev: "短暫悲傷、過度樂觀" },
        { name: "審判", up: "覺醒、重生、原諒", rev: "自我懷疑、拒絕改變" },
        { name: "世界", up: "圓滿、完成、旅行", rev: "未完成、停滯" }
    ];

    const readingTypes = {
        daily: { id: 'daily', title: "🌟 每日運勢", name: "今日運勢", count: 1, labels: ["今日整體狀態"] },
        work: { id: 'work', title: "💼 工作運勢", name: "工作發展", count: 3, labels: ["目前工作狀態", "面臨挑戰與建議", "未來事業方向"] },
        wealth: { id: 'wealth', title: "💰 財富運勢", name: "財運走向", count: 3, labels: ["目前財務狀況", "理財盲點與建議", "財運未來走向"] },
        love: { id: 'love', title: "❤️ 感情運勢", name: "感情發展", count: 3, labels: ["目前感情狀態", "雙方互動與建議", "關係未來發展"] },
        health: { id: 'health', title: "🌿 健康運勢", name: "健康狀態", count: 3, labels: ["目前身心狀態", "日常保養建議", "未來健康走向"] },
        palmistry: { id: 'palmistry', title: "✋ 手相運勢", name: "手相運勢", count: 3, labels: ["生命線 (活力與健康)", "智慧線 (思維與事業)", "感情線 (情感與人際)"] }
    };

    const zodiacTraits = {
        "牡羊座":"充滿行動力與熱情", "金牛座":"務實穩重與耐心", "雙子座":"思維敏捷與適應力強",
        "巨蟹座":"細膩直覺與防衛心", "獅子座":"自信耀眼與主導力", "處女座":"嚴謹細心與追求完美",
        "天秤座":"追求平衡與和諧", "天蠍座":"洞察力深與愛恨分明", "射手座":"熱愛自由與樂觀",
        "摩羯座":"踏實堅忍與企圖心", "水瓶座":"打破常規與獨立創新", "雙魚座":"浪漫感性與直覺力"
    };

    const czTraits = {
        "鼠":"機智靈巧、反應快", "牛":"腳踏實地、刻苦耐勞", "虎":"勇猛果敢、具威嚴",
        "兔":"溫和謹慎、心思細膩", "龍":"氣宇軒昂、追求卓越", "蛇":"冷靜沉著、直覺銳利",
        "馬":"奔放熱情、勇往直前", "羊":"溫順包容、堅韌不拔", "猴":"聰穎機智、靈活多變",
        "雞":"勤奮自信、條理分明", "狗":"忠誠正直、重情重義", "豬":"豁達隨和、樂觀知足"
    };

    let drawnCards = [];
    let flippedCount = 0;
    let currentReading = null;

    function getRandomCards(count) {
        let deck = [...majorArcana];
        let selected = [];
        for(let i=0; i<count; i++) {
            let index = Math.floor(Math.random() * deck.length);
            let card = deck.splice(index, 1)[0];
            let isReversed = Math.random() > 0.5;
            selected.push({ ...card, isReversed });
        }
        return selected;
    }

    function startReading(type) {
        currentReading = readingTypes[type];
        drawnCards = getRandomCards(currentReading.count);
        flippedCount = 0;

        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('reading-screen').classList.remove('hidden');
        document.getElementById('reading-title').innerText = currentReading.title;
        document.getElementById('result-text').classList.add('hidden');
        
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        drawnCards.forEach((card, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.innerHTML = `
                <div class="card-label">${currentReading.labels[index]}</div>
                <div class="card" onclick="flipCard(this, ${index})">
                    <div class="card-inner">
                        <div class="card-back"></div>
                        <div class="card-front">
                            <div class="card-name">${card.name}</div>
                            <div class="card-status">${card.isReversed ? '【逆位】' : '【正位】'}</div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
        });
    }

    function flipCard(element, index) {
        if (element.classList.contains('flipped')) return;
        const cardData = drawnCards[index];
        element.classList.add('flipped');
        if (cardData.isReversed) setTimeout(() => element.classList.add('reversed'), 400);
        
        flippedCount++;
        if (flippedCount === currentReading.count) setTimeout(generateAnalysis, 1200);
    }

    // 動態產生專屬領域的解讀文案
    function getContextualMeaning(card, typeId) {
        const keyword = card.isReversed ? card.rev : card.up;
        if (typeId === 'love') return card.isReversed ? `在感情層面上，這張牌暗示了${keyword}的阻礙，需特別留意。` : `在感情中展現出${keyword}的強大能量，關係發展順遂。`;
        if (typeId === 'work') return card.isReversed ? `職場上容易遇到${keyword}的狀況，建議保守應對。` : `事業上將迎來${keyword}的契機，適合積極表現。`;
        if (typeId === 'wealth') return card.isReversed ? `理財需避免${keyword}的陷阱，切勿盲目投資。` : `財富受到${keyword}的加持，有機會獲得不錯的回報。`;
        if (typeId === 'health') return card.isReversed ? `身心狀態呈現${keyword}的警訊，需適當休息與調整。` : `目前健康充滿${keyword}的正面活力，免疫力佳。`;
        if (typeId === 'palmistry') return card.isReversed ? `這條掌紋目前反映出${keyword}的弱點或波折。` : `這條主線展現了${keyword}的先天優勢與強大運勢。`;
        return `整體運勢呈現${keyword}的狀態。`;
    }

    function generateAnalysis() {
        document.getElementById('result-text').classList.remove('hidden');
        
        const zodiac = document.getElementById('zodiac-select').value;
        const cz = document.getElementById('chinese-zodiac-select').value;
        const typeId = currentReading.id;
        const typeName = currentReading.name;

        // 1. 塔羅的同步分析 (對應牌陣每個階段)
        let tarotHtml = `<h3>🃏 塔羅牌眼中的「${typeName}」</h3>`;
        drawnCards.forEach((card, i) => {
            const status = card.isReversed ? '逆位' : '正位';
            tarotHtml += `<p><strong>【${currentReading.labels[i]}】${card.name} (${status})</strong><br>${getContextualMeaning(card, typeId)}</p>`;
        });
        document.getElementById('box-tarot').innerHTML = tarotHtml;

        // 2. 星座的同步分析 (對應牌陣每個階段)
        const zTrait = zodiacTraits[zodiac];
        let zodiacHtml = `<h3>♈ 星座運勢同步解析</h3>`;
        zodiacHtml += `<p>身為${zodiac}，你天生具備「<span class="highlight">${zTrait}</span>」的特質。這股星象能量在此刻的${typeName}中扮演著關鍵角色：</p><ul>`;
        drawnCards.forEach((card, i) => {
            if(i === 0) zodiacHtml += `<li><strong>面對【${currentReading.labels[i]}】</strong>：你的星座本性會影響你當下的判斷，${card.isReversed ? '容易因情緒波動而感到迷惘。' : '讓你充滿自信地掌握主導權。'}</li>`;
            else if(i === 1) zodiacHtml += `<li><strong>關於【${currentReading.labels[i]}】</strong>：星象建議你，適時發揮或收斂「${zTrait.split('與')[0]}」的特質，將是突破當前僵局的關鍵。</li>`;
            else zodiacHtml += `<li><strong>展望【${currentReading.labels[i]}】</strong>：只要順應你天生的節奏，未來的發展軌跡將會逐漸明朗。</li>`;
        });
        zodiacHtml += `</ul>`;
        document.getElementById('box-zodiac').innerHTML = zodiacHtml;

        // 3. 生肖的同步分析 (對應牌陣每個階段)
        const cTrait = czTraits[cz];
        let czHtml = `<h3>🐀 生肖流年同步解析</h3>`;
        czHtml += `<p>屬${cz}的你，在流年磁場中展現了「<span class="highlight">${cTrait}</span>」的一面。這份生肖力量正與你的${typeName}產生共鳴：</p><ul>`;
        drawnCards.forEach((card, i) => {
            if(i === 0) czHtml += `<li><strong>在【${currentReading.labels[i]}】的表現</strong>：生肖本能讓你對現狀有著直覺的反應，${card.isReversed ? '需留意別讓急躁或固執壞了事。' : '能穩健地應對各種變化。'}</li>`;
            else if(i === 1) czHtml += `<li><strong>在【${currentReading.labels[i]}】的應對</strong>：生肖磁場提醒你，多運用「${cTrait.split('、')[0]}」的智慧來化解人事物上的摩擦。</li>`;
            else czHtml += `<li><strong>在【${currentReading.labels[i]}】的期盼</strong>：保持你生肖中強韌的生命力，好運與貴人自然會在前方等待。</li>`;
        });
        czHtml += `</ul>`;
        document.getElementById('box-cz').innerHTML = czHtml;

        // 4. 終極綜合分析
        // 計算牌陣整體的正逆位比例來決定整體能量
        const upCount = drawnCards.filter(c => !c.isReversed).length;
        let combinedHtml = `<h3>🌟 塔羅 × 星座 × 生肖 終極綜合分析</h3>`;
        
        if(upCount < drawnCards.length / 2) {
            combinedHtml += `<p>綜合盤勢顯示：綜觀你這幾張牌的發展軌跡，塔羅牌呈現出較多逆位的拉扯能量。這代表你在${typeName}上面臨的考驗，可能正與${zodiac}的本性或屬${cz}的脾氣產生內在矛盾。</p>`;
            combinedHtml += `<p>💡 <strong>最終建議：</strong>現階段請先放慢腳步。在處理【${currentReading.labels[0]}】與【${currentReading.labels[1]}】時，不要急於求成，適時調和內心衝突，【${currentReading.labels[currentReading.labels.length-1]}】才會迎來轉機。</p>`;
        } else {
            combinedHtml += `<p>綜合盤勢顯示：非常棒的能量矩陣！綜觀牌陣的發展軌跡，你生肖「${cTrait.split('、')[0]}」的優勢完美契合了${zodiac}近期的星象。塔羅牌陣的正位能量更為你帶來了強大的推進力。</p>`;
            combinedHtml += `<p>💡 <strong>最終建議：</strong>只要你在此刻的【${currentReading.labels[0]}】上保持自信，並將「${zTrait.split('與')[0]}」的天賦運用在【${currentReading.labels[1]}】上，必定能將阻力化為豐碩的果實！</p>`;
        }
        document.getElementById('box-combined').innerHTML = combinedHtml;
    }

    function resetApp() {
        document.getElementById('menu-screen').classList.remove('hidden');
