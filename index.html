<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命理綜合占卜</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #e0e0e0;
            --accent-gold: #f1c40f;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .container {
            width: 95%;
            max-width: 800px;
            margin: 2rem auto;
            text-align: center;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1, h2 { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.4); }
        select, button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        select option { background: #1b2735; color: #fff; }
        button:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .hidden { display: none !important; }
        
        /* 卡牌區塊 */
        .cards-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .card-wrapper { display: flex; flex-direction: column; align-items: center; width: 140px; }
        .card-label { margin-bottom: 10px; font-weight: bold; color: var(--accent-gold); font-size: 14px; }
        .card { width: 120px; height: 200px; perspective: 1000px; cursor: pointer; }
        .card-inner { width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; position: relative; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card.flipped.reversed .card-inner { transform: rotateY(180deg) rotateZ(180deg); }
        .card-front, .card-back {
            width: 100%; height: 100%; position: absolute; backface-visibility: hidden;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--glass-border);
        }
        .card-back {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0, rgba(255,255,255,0.1) 2px, transparent 2px, transparent 10px);
        }
        .card-front {
            background: #fff; color: #000; transform: rotateY(180deg);
            flex-direction: column; text-align: center; padding: 10px; box-sizing: border-box;
        }
        .card-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .card-status { font-size: 12px; color: #e74c3c; margin-bottom: 10px; }
        
        /* 四大分析區塊 */
        .result-container { margin-top: 30px; text-align: left; }
        .analysis-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-gold);
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 0 10px 10px 0;
            line-height: 1.6;
        }
        .analysis-box.tarot { border-left-color: #9b59b6; background: rgba(155, 89, 182, 0.1); }
        .analysis-box.zodiac { border-left-color: #e67e22; background: rgba(230, 126, 34, 0.1); }
        .analysis-box.cz { border-left-color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .analysis-box.combined { border-left-color: #3498db; background: rgba(52, 152, 219, 0.1); }
        
        .analysis-box h3 { margin-top: 0; color: #fff; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
        .highlight { color: var(--accent-gold); font-weight: bold; }
    </style>
</head>

        { name: "星星", up: "希望、靈感、平靜", rev: "絕望、悲觀", love_up: "感情充滿純粹的希望與理想，雙方對未來有著美好的憧憬。", love_rev: "對感情感到悲觀與失望，或是理想與現實存在過大落差。", work_up: "創意與靈感源源不絕，職涯前景明朗，將獲得貴人指引。", work_rev: "工作失去目標與動力，因自我懷疑而錯失展現才華的機會。", wealth_up: "財務狀況漸入佳境，長線投資或與藝術相關的產業將獲利。", wealth_rev: "因過度樂觀而誤判財務情勢，或是對理財前景感到迷惘。" },
        { name: "月亮", up: "不安、恐懼、潛意識", rev: "真相大白、撥雲見日", love_up: "關係中充滿猜忌與不安，或是存在著未知的隱瞞與秘密。", love_rev: "解開感情中的誤會與疑慮，隱藏的真相終於浮出水面。", work_up: "職場環境晦暗不明，需小心背後的流言蜚語與潛在陷阱。", work_rev: "釐清了工作上的混亂局勢，內心的恐懼消散，方向轉為清晰。", wealth_up: "財務狀況不明朗，投資存在隱藏風險，切勿盲目聽信內線。", wealth_rev: "看破了財務騙局，或是結束了長期的資金混亂狀態。" },
        { name: "太陽", up: "成功、喜悅、活力", rev: "短暫悲傷、過度樂觀", love_up: "感情發展熱烈且公開，充滿快樂與溫暖，甚至有新生命降臨。", love_rev: "關係中出現短暫的烏雲，或是對感情的期待過於天真不切實際。", work_up: "事業迎來巔峰與成功，表現備受矚目，充滿無窮的活力與自信。", work_rev: "工作成果被打折扣，或是因過度自信而導致細節上出現疏漏。", wealth_up: "財富豐收，投資獲利亮眼，正偏財運皆處於極佳的狀態。", wealth_rev: "收益不如預期般豐厚，或是因過度揮霍而使得財富迅速流失。" },
        { name: "審判", up: "覺醒、重生、原諒", rev: "自我懷疑、拒絕改變", love_up: "感情迎來重要的轉捩點，解開心結後關係獲得昇華與重生。", love_rev: "無法原諒過去的錯誤，深陷內疚之中，不願面對感情的改變。", work_up: "職涯面臨重要的考核或抉擇，過去的努力將決定最終的成果。", work_rev: "害怕接受新的挑戰，或是因過去的失敗陰影而停滯不前。", wealth_up: "財務狀況迎來關鍵的評估期，做對決策將徹底翻轉經濟現狀。", wealth_rev: "逃避財務問題，拒絕為過去的錯誤理財決策承擔責任與改變。" },
        { name: "世界", up: "圓滿、完成、旅行", rev: "未完成、停滯", love_up: "感情修成正果，達到完美的和諧階段，或是一段美好的異國戀情。", love_rev: "關係卡在最後一步無法突破，或是缺乏跨出舒適圈的勇氣。", work_up: "專案完美收尾，事業版圖成功擴展，適合往海外或跨界發展。", work_rev: "工作成果缺乏臨門一腳，或是格局受限無法進一步提升。", wealth_up: "達成財務自由或階段性理財目標，海外投資將帶來豐厚回報。", wealth_rev: "理財計畫因準備不足而延宕，或是跨國投資面臨阻礙與延遲。" }
    ];

    const readingTypes = {
        daily: { id: 'daily', title: "🌟 每日運勢", name: "今日運勢", count: 1, labels: ["今日塔羅指引"] },
        work: { id: 'work', title: "💼 工作運勢", name: "工作運勢", count: 3, labels: ["目前工作狀態", "面臨挑戰與建議", "未來事業方向"] },
        wealth: { id: 'wealth', title: "💰 財富運勢", name: "財富運勢", count: 3, labels: ["目前財務狀況", "理財盲點與建議", "財運未來走向"] },
        love: { id: 'love', title: "❤️ 感情運勢", name: "感情運勢", count: 3, labels: ["目前感情狀態", "雙方互動與建議", "關係未來發展"] }
    };

    const zodiacTraits = {
        "牡羊座":"充滿行動力與熱情", "金牛座":"務實穩重與耐心", "雙子座":"思維敏捷與適應力強",
        "巨蟹座":"細膩直覺與防衛心", "獅子座":"自信耀眼與主導力", "處女座":"嚴謹細心與追求完美",
        "天秤座":"追求平衡與和諧", "天蠍座":"洞察力深與愛恨分明", "射手座":"熱愛自由與樂觀",
        "摩羯座":"踏實堅忍與企圖心", "水瓶座":"打破常規與獨立創新", "雙魚座":"浪漫感性與直覺力"
    };

    const czTraits = {
        "鼠":"機智靈巧、反應快", "牛":"腳踏實地、刻苦耐勞", "虎":"勇猛果敢、具威嚴",
        "兔":"溫和謹慎、心思細膩", "龍":"氣宇軒昂、追求卓越", "蛇":"冷靜沉著、直覺銳利",
        "馬":"奔放熱情、勇往直前", "羊":"溫順包容、堅韌不拔", "猴":"聰穎機智、靈活多變",
        "雞":"勤奮自信、條理分明", "狗":"忠誠正直、重情重義", "豬":"豁達隨和、樂觀知足"
    };

    let drawnCards = [];
    let flippedCount = 0;
    let currentReading = null;

    function getRandomCards(count) {
        let deck = [...majorArcana];
        let selected = [];
        for(let i=0; i<count; i++) {
            let index = Math.floor(Math.random() * deck.length);
            let card = deck.splice(index, 1)[0];
            let isReversed = Math.random() > 0.5;
            selected.push({ ...card, isReversed });
        }
        return selected;
    }

    function startReading(type) {
        currentReading = readingTypes[type];
        drawnCards = getRandomCards(currentReading.count);
        flippedCount = 0;

        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('reading-screen').classList.remove('hidden');
        document.getElementById('reading-title').innerText = currentReading.title;
        document.getElementById('result-text').classList.add('hidden');
        
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        drawnCards.forEach((card, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.innerHTML = `
                <div class="card-label">${currentReading.labels[index]}</div>
                <div class="card" onclick="flipCard(this, ${index})">
                    <div class="card-inner">
                        <div class="card-back"></div>
                        <div class="card-front">
                            <div class="card-name">${card.name}</div>
                            <div class="card-status">${card.isReversed ? '【逆位】' : '【正位】'}</div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
        });
    }

    function flipCard(element, index) {
        if (element.classList.contains('flipped')) return;
        const cardData = drawnCards[index];
        element.classList.add('flipped');
        if (cardData.isReversed) setTimeout(() => element.classList.add('reversed'), 400);
        
        flippedCount++;
        if (flippedCount === currentReading.count) setTimeout(generateAnalysis, 1200);
    }

    function generateAnalysis() {
        document.getElementById('result-text').classList.remove('hidden');
        
        const zodiac = document.getElementById('zodiac-select').value;
        const cz = document.getElementById('chinese-zodiac-select').value;
        const typeId = currentReading.id;
        const typeName = currentReading.name;

        // --- 1. 單獨看塔羅的特定領域 ---
        let tarotHtml = `<h3>🃏 塔羅占卜的${typeName}</h3>`;
        drawnCards.forEach((card, i) => {
            const status = card.isReversed ? '逆位' : '正位';
            let domainMeaning = "";
            // 動態抓取對應領域的牌義 (如 love_up, work_rev)
            if (typeId === 'love' || typeId === 'work' || typeId === 'wealth') {
                const key = typeId + (card.isReversed ? '_rev' : '_up');
                domainMeaning = card[key];
            } else {
                domainMeaning = card.isReversed ? card.rev : card.up;
            }
            tarotHtml += `<p><span class="highlight">【${currentReading.labels[i]}】${card.name} (${status})</span><br>${domainMeaning}</p>`;
        });
        document.getElementById('box-tarot').innerHTML = tarotHtml;

        // --- 2. 單獨看星座的特定領域 ---
        const zTrait = zodiacTraits[zodiac];
        let zodiacText = "";
        if(typeId === 'love') zodiacText = `在感情方面，身為${zodiac}的你，近期「<span class="highlight">${zTrait}</span>」的天性將主導你的關係走向。單身者可透過展現真實自我吸引對象；有伴侶者則需發揮這份特質來維繫感情溫度，避免過度執著於表象。`;
        else if(typeId === 'work') zodiacText = `在事業發展上，${zodiac}「<span class="highlight">${zTrait}</span>」的特質是你突破現狀的最大武器。本期星象鼓勵你在職場中掌握主導權，將你的優勢最大化，能順利獲得認可。`;
        else if(typeId === 'wealth') zodiacText = `在理財規劃上，${zodiac}「<span class="highlight">${zTrait}</span>」的特質提醒你要善用天生直覺。適合依循你的性格穩健佈局，避免被市場盲目的風向帶走資金。`;
        else zodiacText = `今日星象顯示，${zodiac}「<span class="highlight">${zTrait}</span>」的特質將為你帶來獨特活力，順應天性節奏即可。`;
        
        document.getElementById('box-zodiac').innerHTML = `<h3>♈ 星座專屬的${typeName}</h3><p>${zodiacText}</p>`;

        // --- 3. 單獨看生肖的特定領域 ---
        const cTrait = czTraits[cz];
        let czText = "";
        if(typeId === 'love') czText = `根據生肖流年，屬${cz}者「<span class="highlight">${cTrait}</span>」的磁場在近期感情中極為強烈。遇事不宜過度勉強，保持順勢而為的態度，將有意外的桃花或關係轉機。`;
        else if(typeId === 'work') czText = `在職場佈局上，屬${cz}者「<span class="highlight">${cTrait}</span>」的特質能幫你化解不少阻礙。遇到需要應變的時刻，發揮生肖本性，職場貴人運將在不經意間降臨。`;
        else if(typeId === 'wealth') czText = `求財方面，屬${cz}者「<span class="highlight">${cTrait}</span>」的磁場暗示著近期會有新的財務靈感。多留意周遭機會，有機會獲得意想不到的進帳。`;
        else czText = `屬${cz}的你，今日請保持「<span class="highlight">${cTrait}</span>」的本心，好運自然會找上門。`;
        
        document.getElementById('box-cz').innerHTML = `<h3>🐀 生肖專屬的${typeName}</h3><p>${czText}</p>`;

        // --- 4. 綜合塔羅、星座、生肖的特定領域分析 ---
        const mainCard = drawnCards[0];
        let combinedHtml = `<h3>🌟 綜合${typeName}終極分析</h3>`;
        
        if(mainCard.isReversed) {
            combinedHtml += `<p>綜合盤勢顯示：在目前的${typeName}中，你星座中的「${zTrait.split('與')[0]}」可能與生肖「${cTrait.split('、')[0]}」的本性產生了些微矛盾，導致塔羅主牌【${mainCard.name}】反映出逆位能量的拉扯。</p>`;
            combinedHtml += `<p>💡 <strong>專屬建議：</strong>現階段請先放慢腳步。在${typeId === 'love' ? '處理感情' : typeId === 'work' ? '職場決策' : '財務運用'}上，不要急於求成，適時調和內在的矛盾心態，局勢將會自然明朗。</p>`;
        } else {
            combinedHtml += `<p>綜合盤勢顯示：非常棒的組合！在目前的${typeName}中，你生肖「${cTrait.split('、')[0]}」的優勢完美契合了${zodiac}近期的流年星象。塔羅主牌【${mainCard.name}】的正位能量更為你帶來了強大的擴張力。</p>`;
            combinedHtml += `<p>💡 <strong>專屬建議：</strong>只要你在此刻的${typeId === 'love' ? '關係互動' : typeId === 'work' ? '工作表現' : '理財佈局'}上保持自信，順著你天生的性格去執行，必定能將阻力化為豐碩的果實！</p>`;
        }
        document.getElementById('box-combined').innerHTML = combinedHtml;
    }

    function resetApp() {
        document.getElementById('menu-screen').classList.remove('hidden');
        document.getElementById('reading-screen').classList.add('hidden');
    }
</script>
