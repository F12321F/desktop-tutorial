<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘塔羅牌占卜</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #e0e0e0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 2rem auto;
            text-align: center;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        select, button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        select option { background: #1b2735; color: #fff; }
        button:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .hidden { display: none !important; }
        
        /* 卡牌區塊 */
        .cards-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        .card-wrapper { display: flex; flex-direction: column; align-items: center; width: 150px; }
        .card-label { margin-bottom: 10px; font-weight: bold; color: #f39c12; }
        .card {
            width: 120px; height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }
        .card-inner {
            width: 100%; height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card.flipped.reversed .card-inner { transform: rotateY(180deg) rotateZ(180deg); }
        .card-front, .card-back {
            width: 100%; height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--glass-border);
        }
        .card-back {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0, rgba(255,255,255,0.1) 2px, transparent 2px, transparent 10px);
        }
        .card-front {
            background: #fff; color: #000;
            transform: rotateY(180deg);
            flex-direction: column;
            text-align: center;
            padding: 10px; box-sizing: border-box;
        }
        .card-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .card-status { font-size: 12px; color: #e74c3c; margin-bottom: 10px; }
        .result-text { text-align: left; margin-top: 30px; line-height: 1.6; }
        .comprehensive-analysis { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border); color: #f1c40f; }
    </style>
</head>
<body>

<div class="container" id="menu-screen">
    <div class="glass-panel">
        <h1>✨ 塔羅與星象占卜 ✨</h1>
        <p>請選擇你的命理資訊，並挑選要占卜的項目</p>
        
        <div>
            <select id="zodiac-select">
                <option value="牡羊座">♈ 牡羊座</option>
                <option value="金牛座">♉ 金牛座</option>
                <option value="雙子座">♊ 雙子座</option>
                <option value="巨蟹座">♋ 巨蟹座</option>
                <option value="獅子座">♌ 獅子座</option>
                <option value="處女座">♍ 處女座</option>
                <option value="天秤座">♎ 天秤座</option>
                <option value="天蠍座">♏ 天蠍座</option>
                <option value="射手座">♐ 射手座</option>
                <option value="摩羯座">♑ 摩羯座</option>
                <option value="水瓶座">♒ 水瓶座</option>
                <option value="雙魚座">♓ 雙魚座</option>
            </select>
            <select id="chinese-zodiac-select">
                <option value="鼠">🐀 鼠</option>
                <option value="牛">🐂 牛</option>
                <option value="虎">🐅 虎</option>
                <option value="兔">🐇 兔</option>
                <option value="龍">🐉 龍</option>
                <option value="蛇">🐍 蛇</option>
                <option value="馬">🐎 馬</option>
                <option value="羊">🐏 羊</option>
                <option value="猴">🐒 猴</option>
                <option value="雞">🐓 雞</option>
                <option value="狗">🐕 狗</option>
                <option value="豬">🐖 豬</option>
            </select>
        </div>

        <div class="grid-buttons">
            <button onclick="startReading('daily')">🌟 每日運勢 (1張)</button>
            <button onclick="startReading('work')">💼 工作運勢 (3張)</button>
            <button onclick="startReading('wealth')">💰 財運分析 (3張)</button>
            <button onclick="startReading('love')">❤️ 感情運勢 (3張)</button>
        </div>
    </div>
</div>

<div class="container hidden" id="reading-screen">
    <div class="glass-panel">
        <h2 id="reading-title">占卜中...</h2>
        <p>請在心中默念你的問題，然後依序點擊卡牌翻開</p>
        <div class="cards-container" id="cards-container"></div>
        
        <div id="result-text" class="result-text hidden">
            <h3>📖 解牌結果</h3>
            <div id="cards-meaning"></div>
            <div id="comprehensive-analysis" class="comprehensive-analysis"></div>
            <button onclick="resetApp()" style="margin-top:20px; width:100%;">返回首頁重新占卜</button>
        </div>
    </div>
</div>

<script>
    // 註冊 Service Worker (維持 App 功能)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed', err));
    }

    const majorArcana = [
        { name: "愚者", up: "新的開始、冒險、天真", rev: "魯莽、冒險的風險、不穩定" },
        { name: "魔術師", up: "創造力、技能、意志力", rev: "潛能未發揮、欺騙、缺乏自信" },
        { name: "女祭司", up: "直覺、神秘、潛意識", rev: "隱藏的秘密、忽視直覺、表面" },
        { name: "皇后", up: "豐收、母性、培育", rev: "依賴、缺乏成長、窒息的愛" },
        { name: "皇帝", up: "權威、結構、控制", rev: "獨裁、缺乏紀律、固執" },
        { name: "教皇", up: "傳統、信仰、教育", rev: "叛逆、打破傳統、盲從" },
        { name: "戀人", up: "愛情、和諧、選擇", rev: "失和、錯誤的選擇、關係破裂" },
        { name: "戰車", up: "勝利、意志、克服困難", rev: "失控、方向不明、挫折" },
        { name: "力量", up: "勇氣、耐心、內在力量", rev: "自我懷疑、軟弱、失去控制" },
        { name: "隱者", up: "反省、孤獨、內在指引", rev: "孤立、過度退縮、拒絕幫助" },
        { name: "命運之輪", up: "轉折、命運、好運", rev: "霉運、抗拒改變、失去控制" },
        { name: "正義", up: "公平、真相、法律", rev: "不公、偏見、逃避責任" },
        { name: "倒吊人", up: "犧牲、新視角、暫停", rev: "無謂的犧牲、停滯不前、猶豫" },
        { name: "死神", up: "結束、轉變、新生", rev: "抗拒改變、停滯、無法放下" },
        { name: "節制", up: "平衡、和諧、耐心", rev: "極端、失衡、缺乏耐心" },
        { name: "惡魔", up: "束縛、沉迷、物質主義", rev: "解脫、重獲自由、克服誘惑" },
        { name: "高塔", up: "突變、災難、信念崩塌", rev: "避免災難、害怕改變、拖延" },
        { name: "星星", up: "希望、靈感、平靜", rev: "絕望、失去信念、悲觀" },
        { name: "月亮", up: "幻覺、恐懼、潛意識", rev: "釋放恐懼、真相大白、困惑" },
        { name: "太陽", up: "成功、喜悅、活力", rev: "短暫的悲傷、成功延遲、過度樂觀" },
        { name: "審判", up: "重生、覺醒、原諒", rev: "自我懷疑、拒絕改變、內疚" },
        { name: "世界", up: "完成、圓滿、旅行", rev: "未完成、停滯、缺乏封閉" }
    ];

    const readingTypes = {
        daily: { title: "🌟 每日運勢", count: 1, labels: ["今日指引"] },
        work: { title: "💼 工作運勢", count: 3, labels: ["目前工作狀態", "面臨的挑戰/建議", "未來發展"] },
        wealth: { title: "💰 財運分析", count: 3, labels: ["目前財務狀況", "理財建議", "財富走向"] },
        love: { title: "❤️ 感情運勢", count: 3, labels: ["目前感情狀態", "雙方互動/建議", "未來發展"] }
    };

    let drawnCards = [];
    let flippedCount = 0;
    let currentReadingInfo = null;

    function getRandomCards(count) {
        let deck = [...majorArcana];
        let selected = [];
        for(let i=0; i<count; i++) {
            let index = Math.floor(Math.random() * deck.length);
            let card = deck.splice(index, 1)[0];
            let isReversed = Math.random() > 0.5;
            selected.push({ ...card, isReversed });
        }
        return selected;
    }

    function startReading(type) {
        currentReadingInfo = readingTypes[type];
        drawnCards = getRandomCards(currentReadingInfo.count);
        flippedCount = 0;

        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('reading-screen').classList.remove('hidden');
        document.getElementById('reading-title').innerText = currentReadingInfo.title;
        document.getElementById('result-text').classList.add('hidden');
        
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        drawnCards.forEach((card, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            
            const label = document.createElement('div');
            label.className = 'card-label';
            label.innerText = currentReadingInfo.labels[index];

            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.onclick = () => flipCard(cardEl, card, index);

            cardEl.innerHTML = `
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front">
                        <div class="card-name">${card.name}</div>
                        <div class="card-status">${card.isReversed ? '【逆位】' : '【正位】'}</div>
                    </div>
                </div>
            `;
            wrapper.appendChild(label);
            wrapper.appendChild(cardEl);
            container.appendChild(wrapper);
        });
    }

    function flipCard(element, cardData, index) {
        if (element.classList.contains('flipped')) return;
        
        element.classList.add('flipped');
        if (cardData.isReversed) {
            setTimeout(() => element.classList.add('reversed'), 400);
        }
        
        flippedCount++;
        if (flippedCount === currentReadingInfo.count) {
            setTimeout(showResult, 1000);
        }
    }

    function showResult() {
        document.getElementById('result-text').classList.remove('hidden');
        const meaningContainer = document.getElementById('cards-meaning');
        meaningContainer.innerHTML = '';

        drawnCards.forEach((card, index) => {
            const keyword = card.isReversed ? card.rev : card.up;
            const status = card.isReversed ? '逆位' : '正位';
            meaningContainer.innerHTML += `
                <p><strong>${currentReadingInfo.labels[index]}：${card.name} (${status})</strong><br>
                解讀關鍵：${keyword}</p>
            `;
        });

        generateComprehensiveAnalysis();
    }

    function generateComprehensiveAnalysis() {
        const zodiac = document.getElementById('zodiac-select').value;
        const chineseZodiac = document.getElementById('chinese-zodiac-select').value;
        const mainCard = drawnCards[0];
        const statusText = mainCard.isReversed ? '逆位' : '正位';
        
        const analysisBox = document.getElementById('comprehensive-analysis');
        
        // 簡易的動態文案引擎
        let baseMsg = `<h3>✨ 綜合星象與生肖分析 ✨</h3>`;
        baseMsg += `<p>身為重視自我節奏的<strong>${zodiac}</strong>，同時帶有<strong>屬${chineseZodiac}</strong>特有行事風格的你，在這次占卜中迎來了「${mainCard.name}」的${statusText}。</p>`;
        
        if (!mainCard.isReversed) {
            baseMsg += `<p>這股能量與你的命理特質產生正向共鳴。星象顯示你近期的直覺較為敏銳，生肖運程也暗示著穩步向前的契機。塔羅牌提醒你：發揮你天生的優勢，將卡牌代表的「${mainCard.up}」精神融入你的決策中，順勢而為將會帶來好結果。</p>`;
        } else {
            baseMsg += `<p>這股逆位能量提醒著你，近期需要稍微收斂本性中的衝動或固執。結合你的星座與生肖特質，你可能會感到外在環境與內心期盼有些拉扯。塔羅牌建議你留意「${mainCard.rev}」的潛在挑戰，適時調整心態，方能化阻力為助力。</p>`;
        }

        analysisBox.innerHTML = baseMsg;
    }

    function resetApp() {
        document.getElementById('menu-screen').classList.remove('hidden');
        document.getElementById('reading-screen').classList.add('hidden');
    }
</script>

</body>
</html>
