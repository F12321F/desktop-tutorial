<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命理綜合占卜</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #e0e0e0;
            --accent-gold: #f1c40f;
        }
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        .container { width: 95%; max-width: 800px; margin: 2rem auto; text-align: center; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        h1, h2 { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.4); }
        select, button, input[type="file"] { background: rgba(255, 255, 255, 0.15); border: 1px solid var(--glass-border); color: #fff; padding: 12px 15px; margin: 8px; border-radius: 10px; font-size: 15px; cursor: pointer; transition: 0.3s; }
        select option { background: #1b2735; color: #fff; }
        button:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .hidden { display: none !important; }
        
        /* 卡牌區塊 */
        .cards-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .card-wrapper { display: flex; flex-direction: column; align-items: center; width: 140px; }
        .card-label { margin-bottom: 10px; font-weight: bold; color: var(--accent-gold); font-size: 14px; text-align: center; height: 40px;}
        .card { width: 120px; height: 200px; perspective: 1000px; cursor: pointer; }
        .card-inner { width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; position: relative; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card.flipped.reversed .card-inner { transform: rotateY(180deg) rotateZ(180deg); }
        .card-front, .card-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-border); }
        .card-back { background: linear-gradient(135deg, #2c3e50, #3498db); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0, rgba(255,255,255,0.1) 2px, transparent 2px, transparent 10px); }
        .card-front { background: #fff; color: #000; transform: rotateY(180deg); flex-direction: column; text-align: center; padding: 10px; box-sizing: border-box; }
        .card-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .card-status { font-size: 12px; color: #e74c3c; margin-bottom: 10px; }
        
        /* 四大分析區塊 */
        .result-container { margin-top: 30px; text-align: left; }
        .analysis-box { background: rgba(0, 0, 0, 0.3); border-left: 4px solid var(--accent-gold); padding: 15px 20px; margin-bottom: 20px; border-radius: 0 10px 10px 0; line-height: 1.6; }
        .analysis-box.tarot { border-left-color: #9b59b6; background: rgba(155, 89, 182, 0.1); }
        .analysis-box.zodiac { border-left-color: #e67e22; background: rgba(230, 126, 34, 0.1); }
        .analysis-box.cz { border-left-color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .analysis-box.combined { border-left-color: #3498db; background: rgba(52, 152, 219, 0.1); }
        .analysis-box h3 { margin-top: 0; color: #fff; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
        .highlight { color: var(--accent-gold); font-weight: bold; }
        ul { padding-left: 20px; margin-top: 10px; }
        li { margin-bottom: 10px; }
        
        /* 手相掃描動畫 */
        #scanner-box { position: relative; width: 250px; height: 350px; margin: 20px auto; border: 2px dashed var(--accent-gold); overflow: hidden; display: none; }
        #palm-preview { width: 100%; height: 100%; object-fit: cover; }
        .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #00ffcc; box-shadow: 0 0 10px #00ffcc; animation: scan 2s linear infinite; display: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body>

<div class="container" id="menu-screen">
    <div class="glass-panel">
        <h1>✨ 命理綜合占卜 ✨</h1>
        <p>結合塔羅、星座、生肖與時間維度，為你提供全方位的指引</p>
        
        <div>
            <select id="time-range-select" style="border-color: var(--accent-gold);">
                <option value="today">📅 今日運勢</option>
                <option value="week">📅 本週運勢</option>
                <option value="month">📅 本月運勢</option>
                <option value="3months">📅 未來三個月</option>
                <option value="year">📅 今年運勢</option>
            </select>
            <br>
            <select id="zodiac-select">
                <option value="牡羊座">♈ 牡羊座</option><option value="金牛座">♉ 金牛座</option><option value="雙子座">♊ 雙子座</option><option value="巨蟹座">♋ 巨蟹座</option><option value="獅子座">♌ 獅子座</option><option value="處女座">♍ 處女座</option><option value="天秤座">♎ 天秤座</option><option value="天蠍座">♏ 天蠍座</option><option value="射手座">♐ 射手座</option><option value="摩羯座">♑ 摩羯座</option><option value="水瓶座">♒ 水瓶座</option><option value="雙魚座">♓ 雙魚座</option>
            </select>
            <select id="chinese-zodiac-select">
                <option value="鼠">🐀 鼠</option><option value="牛">🐂 牛</option><option value="虎">🐅 虎</option><option value="兔">🐇 兔</option><option value="龍">🐉 龍</option><option value="蛇">🐍 蛇</option><option value="馬">🐎 馬</option><option value="羊">🐏 羊</option><option value="猴">🐒 猴</option><option value="雞">🐓 雞</option><option value="狗">🐕 狗</option><option value="豬">🐖 豬</option>
            </select>
        </div>

        <div class="grid-buttons">
            <button onclick="startReading('daily')">🌟 整體運勢</button>
            <button onclick="startReading('work')">💼 工作事業</button>
            <button onclick="startReading('wealth')">💰 財富理財</button>
            <button onclick="startReading('love')">❤️ 感情戀愛</button>
            <button onclick="startReading('health')" style="border-color: #2ecc71;">🌿 身心健康</button>
            <button onclick="startPalmistry()" style="border-color: #9b59b6;">✋ 手相運勢 (相機)</button>
        </div>
    </div>
</div>

<!-- 手相拍照區 -->
<div class="container hidden" id="palmistry-screen">
    <div class="glass-panel">
        <h2>✋ 手相掃描</h2>
        <p>請上傳或拍攝你的手掌照片（我們不會儲存您的照片）</p>
        <input type="file" id="palm-input" accept="image/*" onchange="handlePalmUpload(event)">
        <div id="scanner-box">
            <img id="palm-preview" src="" alt="手相預覽">
            <div class="scan-line" id="scan-line"></div>
        </div>
        <p id="scan-text" style="color:var(--accent-gold); font-weight:bold;"></p>
        <button onclick="resetApp()" style="margin-top:20px;">返回首頁</button>
    </div>
</div>

<div class="container hidden" id="reading-screen">
    <div class="glass-panel">
        <h2 id="reading-title">占卜中...</h2>
        <p id="reading-subtitle">請依序點擊下方卡牌，翻開你的命運</p>
        <div class="cards-container" id="cards-container"></div>
        
        <div id="result-text" class="result-container hidden">
            <div class="analysis-box tarot" id="box-tarot"></div>
            <div class="analysis-box zodiac" id="box-zodiac"></div>
            <div class="analysis-box cz" id="box-cz"></div>
            <div class="analysis-box combined" id="box-combined"></div>
            <button onclick="resetApp()" style="margin-top:20px; width:100%;">返回首頁重新占卜</button>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
    }

    const majorArcana = [
        { name: "愚者", up: "新的開始、冒險、天真", rev: "魯莽、不穩定" },
        { name: "魔術師", up: "創造力、主動、技能", rev: "潛能未發揮、欺騙" },
        { name: "女祭司", up: "直覺、神秘、潛意識", rev: "忽視直覺、表面" },
        { name: "皇后", up: "豐收、母性、培育", rev: "依賴、缺乏成長" },
        { name: "皇帝", up: "權威、結構、控制", rev: "獨裁、固執" },
        { name: "教皇", up: "傳統、信仰、教育", rev: "叛逆、打破傳統" },
        { name: "戀人", up: "結合、美好的選擇", rev: "失和、錯誤決定" },
        { name: "戰車", up: "勝利、意志力、推進", rev: "失控、挫折" },
        { name: "力量", up: "勇氣、耐心、內在力量", rev: "自我懷疑、軟弱" },
        { name: "隱者", up: "反省、內在指引", rev: "孤立、拒絕幫助" },
        { name: "命運之輪", up: "轉機、好運、順勢", rev: "霉運、抗拒改變" },
        { name: "正義", up: "公平、平衡、理性", rev: "不公、偏見" },
        { name: "倒吊人", up: "換位思考、犧牲、暫停", rev: "無謂犧牲、停滯" },
        { name: "死神", up: "結束、轉變、新生", rev: "抗拒改變、無法放下" },
        { name: "節制", up: "平衡、和諧、淨化", rev: "極端、失衡" },
        { name: "惡魔", up: "慾望、物質、束縛", rev: "解脫、重獲自由" },
        { name: "高塔", up: "突變、災難、信念崩塌", rev: "危機解除、拖延改變" },
        { name: "星星", up: "希望、靈感、平靜", rev: "絕望、悲觀" },
        { name: "月亮", up: "不安、恐懼、潛意識", rev: "真相大白、撥雲見日" },
        { name: "太陽", up: "成功、喜悅、活力", rev: "短暫悲傷、過度樂觀" },
        { name: "審判", up: "覺醒、重生、原諒", rev: "自我懷疑、拒絕改變" },
        { name: "世界", up: "圓滿、完成、旅行", rev: "未完成、停滯" }
    ];

    const readingTypes = {
        daily: { id: 'daily', name: "整體狀態", count: 1, labels: ["運勢指引"] },
        work: { id: 'work', name: "工作運勢", count: 3, labels: ["目前狀態", "面臨挑戰與建議", "未來發展走向"] },
        wealth: { id: 'wealth', name: "財富運勢", count: 3, labels: ["財務狀況", "理財盲點與建議", "財運未來走向"] },
        love: { id: 'love', name: "感情運勢", count: 3, labels: ["目前感情狀態", "雙方互動與建議", "關係未來發展"] },
        health: { id: 'health', name: "健康運勢", count: 3, labels: ["目前身心狀態", "日常保養建議", "未來健康走向"] },
        palmistry: { id: 'palmistry', name: "手相運勢", count: 3, labels: ["生命線 (活力與健康)", "智慧線 (思維與事業)", "感情線 (情感與人際)"] }
    };

    const zodiacTraits = { "牡羊座":"行動力與熱情", "金牛座":"務實與耐心", "雙子座":"思維敏捷與適應力", "巨蟹座":"細膩直覺與防衛心", "獅子座":"自信與主導力", "處女座":"嚴謹細心與追求完美", "天秤座":"追求平衡與和諧", "天蠍座":"洞察力與愛恨分明", "射手座":"熱愛自由與樂觀", "摩羯座":"踏實堅忍與企圖心", "水瓶座":"打破常規與獨立", "雙魚座":"浪漫感性與直覺力" };
    const czTraits = { "鼠":"機智靈巧", "牛":"腳踏實地", "虎":"勇猛果敢", "兔":"溫和心思細膩", "龍":"追求卓越", "蛇":"冷靜直覺銳利", "馬":"奔放熱情", "羊":"溫順堅韌", "猴":"聰穎靈活多變", "雞":"勤奮條理分明", "狗":"忠誠重情義", "豬":"豁達隨和樂觀" };
    const timeLabels = { "today": "今日", "week": "本週", "month": "本月", "3months": "未來三個月", "year": "今年" };

    let drawnCards = [];
    let flippedCount = 0;
    let currentReading = null;

    // --- 種子亂數產生器 (PRNG) ---
    function cyrb128(str) {
        let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
        for (let i = 0, k; i < str.length; i++) {
            k = str.charCodeAt(i);
            h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
            h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
        }
        h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067); h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
        h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213); h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
        return (h1^h2^h3^h4)>>>0;
    }
    function mulberry32(a) {
        return function() {
          var t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }
    function getTimeString(range) {
        const d = new Date();
        if (range === 'today') return d.toDateString();
        if (range === 'week') { const first = d.getDate() - d.getDay(); return new Date(d.setDate(first)).toDateString(); }
        if (range === 'month') return `${d.getFullYear()}-${d.getMonth()}`;
        if (range === '3months') return `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)}`;
        if (range === 'year') return `${d.getFullYear()}`;
        return d.toDateString();
    }

    // 手相拍照處理
    function startPalmistry() {
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('palmistry-screen').classList.remove('hidden');
    }

    function handlePalmUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('scanner-box').style.display = 'block';
                document.getElementById('palm-preview').src = e.target.result;
                document.getElementById('scan-line').style.display = 'block';
                document.getElementById('scan-text').innerText = "AI 掌紋掃描與時間運勢分析中...";
                setTimeout(() => {
                    document.getElementById('palmistry-screen').classList.add('hidden');
                    startReading('palmistry');
                }, 3000);
            };
            reader.readAsDataURL(file);
        }
    }

    function getSeededCards(count, typeId) {
        const zodiac = document.getElementById('zodiac-select').value;
        const cz = document.getElementById('chinese-zodiac-select').value;
        const timeRange = document.getElementById('time-range-select').value;
        
        // 綁定時間與個人特質產生專屬隨機序列
        const seedStr = zodiac + cz + typeId + getTimeString(timeRange);
        const seed = cyrb128(seedStr);
        const randomFn = mulberry32(seed);

        let deck = [...majorArcana];
        let selected = [];
        for(let i=0; i<count; i++) {
            let index = Math.floor(randomFn() * deck.length);
            let card = deck.splice(index, 1)[0];
            let isReversed = randomFn() > 0.5;
            selected.push({ ...card, isReversed });
        }
        return selected;
    }

    function startReading(type) {
        currentReading = readingTypes[type];
        const timeRange = document.getElementById('time-range-select').value;
        const timeText = timeLabels[timeRange];
        
        drawnCards = getSeededCards(currentReading.count, type);
        flippedCount = 0;

        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('reading-screen').classList.remove('hidden');
        document.getElementById('reading-title').innerText = `✨ ${timeText}的${currentReading.name}`;
        document.getElementById('result-text').classList.add('hidden');
        
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        drawnCards.forEach((card, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.innerHTML = `
                <div class="card-label">${currentReading.labels[index]}</div>
                <div class="card" onclick="flipCard(this, ${index})">
                    <div class="card-inner">
                        <div class="card-back"></div>
                        <div class="card-front">
                            <div class="card-name">${card.name}</div>
                            <div class="card-status">${card.isReversed ? '【逆位】' : '【正位】'}</div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
        });
    }

    function flipCard(element, index) {
        if (element.classList.contains('flipped')) return;
        const cardData = drawnCards[index];
        element.classList.add('flipped');
        if (cardData.isReversed) setTimeout(() => element.classList.add('reversed'), 400);
        
        flippedCount++;
        if (flippedCount === currentReading.count) setTimeout(generateAnalysis, 1200);
    }

    function getContextualMeaning(card, typeId) {
        const keyword = card.isReversed ? card.rev : card.up;
        if (typeId === 'love') return card.isReversed ? `暗示了${keyword}的阻礙。` : `展現出${keyword}的強大能量。`;
        if (typeId === 'work') return card.isReversed ? `易遇${keyword}狀況，建議保守。` : `將迎來${keyword}契機，適合表現。`;
        if (typeId === 'wealth') return card.isReversed ? `需避免${keyword}陷阱，切勿盲目。` : `受${keyword}加持，有機會獲報。`;
        if (typeId === 'health') return card.isReversed ? `呈現${keyword}警訊，需休息。` : `充滿${keyword}正面活力，免疫力佳。`;
        if (typeId === 'palmistry') return card.isReversed ? `反映出近期${keyword}的微弱波折。` : `展現了${keyword}的強大運勢。`;
        return `整體狀態呈現${keyword}。`;
    }

    function generateAnalysis() {
        document.getElementById('result-text').classList.remove('hidden');
        
        const zodiac = document.getElementById('zodiac-select').value;
        const cz = document.getElementById('chinese-zodiac-select').value;
        const typeId = currentReading.id;
        const typeName = currentReading.name;
        
        const timeRange = document.getElementById('time-range-select').value;
        const timeText = timeLabels[timeRange];

        // 1. 塔羅時間分析
        let tarotHtml = `<h3>🃏 【${timeText}】的塔羅解析</h3>`;
        drawnCards.forEach((card, i) => {
            const status = card.isReversed ? '逆位' : '正位';
            tarotHtml += `<p><strong>【${currentReading.labels[i]}】</strong>：${card.name} (${status})<br>${getContextualMeaning(card, typeId)}</p>`;
        });
        document.getElementById('box-tarot').innerHTML = tarotHtml;

        // 2. 星座時間分析
        const zTrait = zodiacTraits[zodiac];
        let zodiacHtml = `<h3>♈ 【${timeText}】的專屬星象觀點</h3>`;
        zodiacHtml += `<p>身為${zodiac}，在<strong>${timeText}</strong>期間，你「<span class="highlight">${zTrait}</span>」的天性將強烈主導${typeName}：</p><ul>`;
        drawnCards.forEach((card, i) => {
            if(i === 0) zodiacHtml += `<li>星象影響：你的星座本能讓你在${timeText}${card.isReversed ? '因情緒波動而迷惘。' : '能自信掌握主導權。'}</li>`;
            else if(i === 1) zodiacHtml += `<li>應對策略：星象建議適時發揮「${zTrait.split('與')[0]}」來突破這段時間的僵局。</li>`;
            else zodiacHtml += `<li>後續發展：順應你天生的節奏，${timeText}的發展將逐漸明朗。</li>`;
        });
        zodiacHtml += `</ul>`;
        document.getElementById('box-zodiac').innerHTML = zodiacHtml;

        // 3. 生肖時間分析
        const cTrait = czTraits[cz];
        let czHtml = `<h3>🐀 【${timeText}】的專屬生肖流年</h3>`;
        czHtml += `<p>屬${cz}的你展現了「<span class="highlight">${cTrait}</span>」的一面。這份生肖力量在<strong>${timeText}</strong>正與${typeName}產生共鳴：</p><ul>`;
        drawnCards.forEach((card, i) => {
            if(i === 0) czHtml += `<li>流年干擾：生肖本能讓你對現狀有直覺反應，${card.isReversed ? `留意別讓急躁壞了${timeText}的大事。` : `能穩健應對${timeText}的變化。`}</li>`;
            else if(i === 1) czHtml += `<li>化解方式：流年提醒多運用「${cTrait}」的優勢化解摩擦。</li>`;
            else czHtml += `<li>結語：保持強韌生命力，${timeText}的好運將在前方等待。</li>`;
        });
        czHtml += `</ul>`;
        document.getElementById('box-cz').innerHTML = czHtml;

        // 4. 終極綜合時間分析
        const upCount = drawnCards.filter(c => !c.isReversed).length;
        let combinedHtml = `<h3>🌟 三位一體【${timeText}】終極指南</h3>`;
        if(upCount < drawnCards.length / 2) {
            combinedHtml += `<p>綜合盤勢顯示：你在<strong>${timeText}</strong>面臨的${typeName}考驗，正與${zodiac}的本性或屬${cz}的脾氣產生矛盾。請先放慢腳步，調和內心衝突，這段期間才會迎來轉機。</p>`;
        } else {
            combinedHtml += `<p>綜合盤勢顯示：絕佳的能量矩陣！在<strong>${timeText}</strong>期間，你生肖的優勢完美契合了${zodiac}星象。只要保持自信，必定能將這段時間的阻力化為豐碩果實！</p>`;
        }
        document.getElementById('box-combined').innerHTML = combinedHtml;
    }

    function resetApp() {
        document.getElementById('menu-screen').classList.remove('hidden');
        document.getElementById('palmistry-screen').classList.add('hidden');
        document.getElementById('reading-screen').classList.add('hidden');
        document.getElementById('scanner-box').style.display = 'none';
        document.getElementById('scan-line').style.display = 'none';
        document.getElementById('scan-text').innerText = '';
        document.getElementById('palm-input').value = '';
    }
</script>

</body>
</html>
